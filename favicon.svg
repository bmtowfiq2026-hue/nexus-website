<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="nexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>

  <!-- Hexagon connections -->
  <polygon points="16,4 26,10 26,22 16,28 6,22 6,10"
           fill="none" stroke="url(#nexus)" stroke-width="0.8" opacity="0.5"/>

  <!-- Cross connections -->
  <g stroke="url(#nexus)" stroke-width="0.5" opacity="0.35">
    <line x1="26" y1="10" x2="16" y2="22"/>
    <line x1="6" y1="10" x2="16" y2="22"/>
  </g>

  <!-- Nodes -->
  <g fill="url(#nexus)">
    <circle cx="16" cy="4" r="2"/>
    <circle cx="26" cy="10" r="2"/>
    <circle cx="26" cy="22" r="2"/>
    <circle cx="16" cy="28" r="2"/>
    <circle cx="6" cy="22" r="2"/>
    <circle cx="6" cy="10" r="2"/>
  </g>

  <!-- Letter N -->
  <g stroke="url(#nexus)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 11 11 L 11 21"/>
    <path d="M 21 11 L 21 21"/>
    <path d="M 11 11 L 21 21"/>
  </g>
</svg>
